name: IBM Quantum Circuit Runner

on:
  push:
    paths:
      - 'quantum_requests/request.json'

jobs:
  run-circuits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ontological-engineering-research-kQfOi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install qiskit qiskit-aer qiskit-ibm-runtime

      - name: Run quantum circuits
        run: python quantum_runner.py

      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add quantum_results/
          git commit -m 'Quantum circuit results from IBM hardware' || echo 'No changes'
          git push
